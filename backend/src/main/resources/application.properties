# Puerto del backend (distinto del proxy)
server.port=8090

# MySQL: crea el schema si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/backend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=backend_user
spring.datasource.password=backend
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: crea/actualiza tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# WebFlux
spring.main.web-application-type=reactive

# Actuator (opcional)
management.endpoints.web.exposure.include=health,info

# URL del proxy
proxy.base-url=http://localhost:8081